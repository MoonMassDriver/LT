<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>LahainaTap</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a; color: #e2e8f0;
      min-height: 100vh; height: 100%; display: flex; flex-direction: column;
      overscroll-behavior: none;
    }
    body.endgame footer, body.endgame #status { display: none; }
    body.endgame #map { flex: 0 0 28vh; min-height: 150px; max-height: 28vh; }
    header {
      background: #1e293b; padding: 10px 16px 8px; text-align: center;
      border-bottom: 1px solid #334155; position: relative; z-index: 5;
    }
    header h1 { font-size: 1.25rem; font-weight: 700; color: #38bdf8; letter-spacing: -0.02em; }
    header p { font-size: 0.75rem; color: #94a3b8; margin-top: 1px; }
    #top-bar {
      display: none; background: #1e293b; padding: 8px 16px;
      border-bottom: 1px solid #334155; align-items: center; justify-content: space-between;
    }
    #top-bar.show { display: flex; }
    #running-total { font-size: 1.05rem; font-weight: 700; color: #38bdf8; }
    #progress { display: flex; gap: 5px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #334155; }
    .dot.done { background: #22c55e; }
    .dot.current { background: #0ea5e9; box-shadow: 0 0 0 2px rgba(14,165,233,0.35); }
    #prompt {
      display: none; background: #1e293b; padding: 10px 16px 12px; text-align: center;
      border-bottom: 1px solid #334155;
    }
    #prompt .label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; color: #64748b; margin-bottom: 3px; }
    #address { font-size: 1.05rem; font-weight: 600; color: #f8fafc; line-height: 1.35; }
    #map { flex: 1; min-height: 260px; width: 100%; background: #0f172a; }
    #controls {
      display: none; background: #1e293b;
      padding: 16px 16px calc(72px + env(safe-area-inset-bottom, 0px));
      border-top: 1px solid #334155;
    }
    .btn {
      display: block; width: 100%; padding: 14px; border: none; border-radius: 10px;
      font-size: 1rem; font-weight: 650; cursor: pointer;
    }
    .btn-primary { background: #0ea5e9; color: #0f172a; }
    .btn-primary:disabled { background: #334155; color: #64748b; cursor: not-allowed; }
    .btn-secondary { background: #334155; color: #e2e8f0; margin-top: 8px; }
    #round-result {
      display: none; background: #1e293b;
      padding: 16px 16px calc(28px + env(safe-area-inset-bottom, 0px));
      border-top: 1px solid #334155; text-align: center;
    }
    #final-result, #locked {
      display: none; background: #1e293b;
      padding: 10px 16px calc(24px + env(safe-area-inset-bottom, 0px));
      border-top: 1px solid #334155; text-align: center;
      flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
      position: relative;
    }
    #round-result.show, #final-result.show, #locked.show { display: block; }
    #round-score { font-size: 1.7rem; font-weight: 800; color: #38bdf8; }
    #round-dist { font-size: 0.9rem; color: #94a3b8; margin: 4px 0 8px; }
    #round-facts {
      display: none; text-align: left; background: #0f172a; border: 1px solid #334155;
      border-radius: 10px; padding: 10px 12px; margin: 0 0 12px;
      font-size: 0.82rem; line-height: 1.45; color: #cbd5e1;
    }
    #round-facts .tag { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.04em; color: #7dd3fc; margin-bottom: 4px; }
    #total-score, #locked-score { font-size: 1.85rem; font-weight: 800; color: #38bdf8; line-height: 1; }
    #score-breakdown { font-size: 0.85rem; color: #94a3b8; margin: 4px 0 8px; }
    #recap-list, #locked-list {
      text-align: left; background: #0f172a; border: 1px solid #334155;
      border-radius: 10px; padding: 8px 10px; margin: 12px 0 8px;
    }
    .recap-row {
      display: flex; align-items: baseline; gap: 8px;
      padding: 5px 0; border-bottom: 1px solid #1e293b; font-size: 0.82rem;
    }
    .recap-row:last-child { border-bottom: none; }
    .recap-num { color: #7dd3fc; font-weight: 700; width: 14px; flex-shrink: 0; }
    .recap-name { flex: 1; color: #e2e8f0; min-width: 0; }
    .recap-meta { text-align: right; flex-shrink: 0; }
    .recap-pts { color: #38bdf8; font-weight: 700; white-space: nowrap; display: block; }
    .recap-dist { color: #94a3b8; font-size: 0.7rem; white-space: nowrap; }
    #share-box, #locked-share {
      background: #0f172a; border: 1px solid #334155; border-radius: 8px;
      padding: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.85rem; color: #cbd5e1; white-space: pre-wrap; margin-bottom: 10px; text-align: left; line-height: 1.45;
    }
    #share-box a, #locked-share a { color: #7dd3fc; }
    #status { text-align: center; padding: 8px 16px; font-size: 0.85rem; color: #94a3b8; background: #0f172a; }
    footer { text-align: center; padding: 8px; font-size: 0.65rem; color: #64748b; background: #0f172a; }
    #victory-banner {
      font-size: 1rem; font-weight: 700; color: #fbbf24; margin-bottom: 4px;
      opacity: 0; transform: scale(0.7);
      transition: all 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    #victory-banner.show { opacity: 1; transform: scale(1); }
    .particle {
      position: absolute; width: 8px; height: 8px; border-radius: 2px;
      pointer-events: none; opacity: 0.9; animation: fall 1.6s ease-out forwards;
    }
    @keyframes fall {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(180px) rotate(240deg); opacity: 0; }
    }
    .leaflet-control-attribution { font-size: 9px !important; }
  </style>
</head>

    <div id="score-breakdown"></div>
    <div id="share-box"></div>
    <button id="copy-btn" class="btn btn-secondary">Copy result</button>
    <div id="recap-list"></div>
  </div>
  <div id="locked">
    <div id="locked-banner" style="font-size:1.05rem;font-weight:700;color:#fbbf24;margin-bottom:6px;">Already played today</div>
    <div style="font-size:0.85rem;color:#94a3b8;margin-bottom:4px;">Today’s score</div>
    <div id="locked-score" style="font-size:2.4rem;font-weight:800;color:#38bdf8;line-height:1;"></div>
    <div id="locked-break" style="font-size:0.9rem;color:#94a3b8;margin:8px 0 10px;"></div>

    <div id="locked-list"></div>

  </div>
  <footer>Satellite map · no labels · same five for everyone today</footer>

    function hawaiiToday() {
      return new Intl.DateTimeFormat('en-CA', {
        timeZone: 'Pacific/Honolulu', year: 'numeric', month: '2-digit', day: '2-digit'
      }).format(new Date());
    }
    function prettyDate(iso) {
      const [y,m,d] = iso.split('-').map(Number);
      return new Date(Date.UTC(y, m-1, d, 18)).toLocaleDateString('en-US', {
        month: 'short', day: 'numeric', timeZone: 'Pacific/Honolulu'
      });
    }
    function hashString(s) {
      let h = 2166136261;
      for (let i = 0; i < s.length; i++) {
        h ^= s.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return h >>> 0;
    }
    function mulberry32(a) {
      return function() {
        let t = a += 0x6D2B79F5;
        t = Math.imul(t ^ t >>> 15, t | 1);
        t ^= t + Math.imul(t ^ t >>> 7, t | 61);
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }
    function pickDaily(dateStr) {
      const rng = mulberry32(hashString('lahainatap|' + dateStr + '|v1'));
      const idx = LOCATIONS.map(function(_, i) { return i; });
      for (let i = idx.length - 1; i > 0; i--) {
        const j = Math.floor(rng() * (i + 1));
        const tmp = idx[i]; idx[i] = idx[j]; idx[j] = tmp;
      }
      return idx.slice(0, 5).map(function(i) { return LOCATIONS[i]; });
    }

    function haversine(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const toRad = function(x) { return x * Math.PI / 180; };
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a = Math.sin(dLat/2)*Math.sin(dLat/2) +
                Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
                Math.sin(dLon/2)*Math.sin(dLon/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }
    function lerp(a, b, t) { return a + (b - a) * t; }
    function scoreFromMeters(m) {
      const ft = m * 3.28084;
      const curve = [
        [0, 100], [300, 100], [600, 95], [1200, 90], [2000, 85],
        [4000, 75], [8000, 65], [16000, 45], [32000, 25], [64000, 0]
      ];
      if (ft <= curve[0][0]) return curve[0][1];
      if (ft >= curve[curve.length - 1][0]) return 0;
      for (let i = 1; i < curve.length; i++) {
        if (ft <= curve[i][0]) {
          const t = (ft - curve[i - 1][0]) / (curve[i][0] - curve[i - 1][0]);
          return Math.round(lerp(curve[i - 1][1], curve[i][1], t));
        }
      }
      return 0;
    }
    function scoreMessage(total) {
      if (total >= 1000) return 'Perfect!';
      if (total >= 950) return 'Outstanding!';
      if (total >= 850) return 'Great Job!';
      if (total >= 700) return 'Nice work!';
      if (total >= 500) return 'Not bad!';
      return 'Better luck tomorrow!';
    }
    function formatDistance(meters) {
      const feet = meters * 3.28084;
      if (feet < 5280) return Math.round(feet).toLocaleString() + ' feet away';
      const miles = feet / 5280;
      return miles.toFixed(miles < 10 ? 2 : 1) + ' miles away';
    }

    let audioCtx = null;
    function unlockAudio() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
      } catch (e) {}
    }
    function playTone(freq, duration, type, volume) {
      try {
        unlockAudio();
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type || 'sine';
        osc.frequency.value = freq;
        gain.gain.value = volume || 0.15;
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }
    function playTap() { playTone(880, 0.08, 'sine', 0.12); }
    function playSubmit() {
      playTone(523, 0.12, 'triangle', 0.18);
      setTimeout(function() { playTone(659, 0.15, 'triangle', 0.14); }, 80);
    }
    function playVictory() {
      [523, 659, 784, 1047].forEach(function(f, i) {

    function loadPlayed() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return null;
        const data = JSON.parse(raw);
        if (data && data.date === today && Array.isArray(data.scores) && data.scores.length === 5) return data;
      } catch (e) {}
      return null;
    }
    function savePlayed(scores) {
      const payload = {
        date: today,
        scores: scores,
        names: roundList.map(function(x){ return x.name; }),
        guesses: roundGuesses
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
    }

    function sharePayload(scores) {
      const total = scores.reduce(function(a,b){ return a+b; }, 0) * 2;
      const line1 = 'LahainaTap ' + today;
      const line3 = scores.join(', ');
      const line4 = 'Final: ' + total + '/1000 - ' + scoreMessage(total);
      return {
        plain: line1 + '\nLink: ' + SHARE_URL + '\n' + line3 + '\n' + line4,
        html: line1 + '<br>Link: <a href="' + SHARE_URL + '">' + SHARE_URL + '</a><br>' + line3 + '<br>' + line4
      };
    }
    function paintShareBox(el, scores) {
      const s = sharePayload(scores);
      lastSharePlain = s.plain;
      lastShareHtml = s.html;
      el.innerHTML = s.html;
    }
    function recapHtml(names, scores, guesses) {
      let html = '';
      for (let i = 0; i < 5; i++) {
        const g = guesses && guesses[i];
        const dist = (g && g.meters != null) ? formatDistance(g.meters) : '';
        html += '<div class="recap-row"><span class="recap-num">' + (i + 1) + '</span>' +
          '<span class="recap-name">' + (names[i] || '') + '</span>' +
          '<span class="recap-meta"><span class="recap-pts">' + scores[i] + '</span>' +
          (dist ? '<span class="recap-dist">' + dist + '</span>' : '') +
          '</span></div>';
      }
      return html;
    }

    function setStatus(t) { document.getElementById('status').textContent = t; }

    function initMap() {
      if (map) return;
      map = L.map('map', {
        center: [20.92, -156.68],
        zoom: 12,
        minZoom: 11,
        maxZoom: 19,
        zoomControl: true
      });
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'Esri', maxZoom: 19
      }).addTo(map);
      map.setMaxBounds(L.latLngBounds([[20.76, -156.73], [21.05, -156.55]]));
      map.on('click', onMapClick);
      setTimeout(function(){ map.invalidateSize(); }, 80);

    function numberedIcon(color, n) {
      return L.divIcon({
        className: '',
        html: '<div style="width:20px;height:20px;background:' + color + ';border:2px solid #fff;border-radius:50%;box-shadow:0 1px 4px rgba(0,0,0,.55);color:#0f172a;font:700 11px/16px -apple-system,sans-serif;text-align:center">' + n + '</div>',
        iconSize: [20,20], iconAnchor: [10,10]
      });

    function clearMarks() {
      if (guessMarker) { map.removeLayer(guessMarker); guessMarker = null; }
      if (trueMarker) { map.removeLayer(trueMarker); trueMarker = null; }
      if (line) { map.removeLayer(line); line = null; }
      if (reviewLayer) { map.removeLayer(reviewLayer); reviewLayer = null; }
    }
    function showAllPins(guesses) {
      if (!map || !guesses || !guesses.length) return;
      clearMarks();
      reviewLayer = L.layerGroup().addTo(map);
      const pts = [];
      for (let i = 0; i < 5; i++) {
        const loc = roundList[i];
        const g = guesses[i];
        if (!loc) continue;
        const tLatLng = L.latLng(loc.lat, loc.lon);
        L.marker(tLatLng, { icon: numberedIcon('#f59e0b', i + 1), zIndexOffset: 400 }).addTo(reviewLayer);
        pts.push(tLatLng);
        if (g && g.lat != null) {
          const gLatLng = L.latLng(g.lat, g.lng);
          L.marker(gLatLng, { icon: numberedIcon('#38bdf8', i + 1), zIndexOffset: 300 }).addTo(reviewLayer);
          L.polyline([gLatLng, tLatLng], { color: '#f8fafc', weight: 2, dashArray: '5 6', opacity: 0.85 }).addTo(reviewLayer);
          pts.push(gLatLng);
        }
      }
      if (pts.length) map.fitBounds(L.latLngBounds(pts).pad(0.2));
      setTimeout(function(){ map.invalidateSize(); }, 80);
    }

    function onMapClick(e) {
      if (!playing) return;
      unlockAudio();
      playTap();
      guessLatLng = e.latlng;
      if (guessMarker) map.removeLayer(guessMarker);
      guessMarker = L.marker(guessLatLng, { icon: guessIcon, zIndexOffset: 300 }).addTo(map);
      const btn = document.getElementById('submit-btn');
      btn.disabled = false;

    function showGuessing() {
      playing = true;
      guessLatLng = null;
      document.getElementById('prompt').style.display = 'block';
      document.getElementById('top-bar').classList.add('show');
      document.getElementById('controls').style.display = 'block';
      document.getElementById('round-result').classList.remove('show');

      document.getElementById('round-label').textContent = '(' + (roundIndex + 1) + ' of 5)';
      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.textContent = 'Tap the map to place your guess';
      setStatus('Tap the map, then Submit.');
      renderDots();
      updateTotal();
      initMap();
      clearMarks();
      map.setView([20.92, -156.68], 12);
      setTimeout(function(){ map.invalidateSize(); }, 60);
    }

    function submitGuess() {
      if (!playing || !guessLatLng) return;
      unlockAudio();
      playSubmit();
      playing = false;
      const loc = roundList[roundIndex];
      const meters = haversine(guessLatLng.lat, guessLatLng.lng, loc.lat, loc.lon);
      const pts = scoreFromMeters(meters);
      roundScores.push(pts);
      roundGuesses.push({ lat: guessLatLng.lat, lng: guessLatLng.lng, meters: meters });
      trueMarker = L.marker([loc.lat, loc.lon], { icon: trueIcon, zIndexOffset: 400 }).addTo(map);
      line = L.polyline([guessLatLng, [loc.lat, loc.lon]], {
        color: '#f8fafc', weight: 2, dashArray: '5 6', opacity: 0.9
      }).addTo(map);
      map.fitBounds(L.latLngBounds([guessLatLng, [loc.lat, loc.lon]]).pad(0.45));
      document.getElementById('controls').style.display = 'none';
      document.getElementById('round-score').textContent = pts + ' / 100';
      document.getElementById('round-dist').textContent = formatDistance(meters);
      const factsEl = document.getElementById('round-facts');
      if (loc.facts) {
        document.getElementById('round-facts-text').textContent = loc.facts;
        factsEl.style.display = 'block';
      } else {
        factsEl.style.display = 'none';
      }
      document.getElementById('next-btn').textContent = roundIndex === 4 ? 'See final score' : 'Next';
      document.getElementById('round-result').classList.add('show');
      updateTotal();
      setStatus('Blue = your guess. Gold = the place.');
    }

    function nextLocation() {
      roundIndex += 1;
      if (roundIndex >= 5) {
        finishGame();
        return;
      }
      showGuessing();
    }

    function finishGame() {
      savePlayed(roundScores);
      document.getElementById('prompt').style.display = 'none';
      document.getElementById('controls').style.display = 'none';
      document.getElementById('round-result').classList.remove('show');
      const raw = roundScores.reduce(function(a,b){ return a+b; }, 0);
      const total = raw * 2;
      document.getElementById('total-score').textContent = total + ' / 1000';
      document.getElementById('score-breakdown').textContent = scoreMessage(total);
      document.getElementById('recap-list').innerHTML = recapHtml(roundList.map(function(x){ return x.name; }), roundScores, roundGuesses);
      document.body.classList.add('endgame');
      paintShareBox(document.getElementById('share-box'), roundScores);
      document.getElementById('final-result').classList.add('show');
      setStatus('Blue = guess. Gold = place. Same number is a pair.');
      renderDots();
      showAllPins(roundGuesses);

      banner.classList.remove('show');

    function burstParticles(parent) {

        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = (8 + Math.random() * 84) + '%';
        p.style.top = '8px';
        p.style.background = colors[i % colors.length];
        p.style.animationDelay = (Math.random() * 0.25) + 's';
        parent.appendChild(p);
        setTimeout(function(){ p.remove(); }, 1800);
      }
    }

    function copyShare(btn) {
      const done = function() {
        const old = btn.textContent;
        btn.textContent = 'Copied';
        setTimeout(function(){ btn.textContent = old; }, 1200);
      };
      const plain = lastSharePlain;
      const html = lastShareHtml;
      if (navigator.clipboard && window.ClipboardItem) {
        const item = new ClipboardItem({
          'text/plain': new Blob([plain], { type: 'text/plain' }),
          'text/html': new Blob([html], { type: 'text/html' })
        });
        navigator.clipboard.write([item]).then(done).catch(function() {
          navigator.clipboard.writeText(plain).then(done).catch(function(){ fallbackCopy(plain, done); });
        });
      } else if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(plain).then(done).catch(function(){ fallbackCopy(plain, done); });
      } else fallbackCopy(plain, done);
    }
    function fallbackCopy(text, done) {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch (e) {}
      ta.remove(); done();
    }

      document.getElementById('top-bar').classList.add('show');
      document.getElementById('prompt').style.display = 'none';
      document.getElementById('controls').style.display = 'none';
      document.getElementById('round-result').classList.remove('show');
      const raw = data.scores.reduce(function(a,b){ return a+b; }, 0);
      const total = raw * 2;
      document.getElementById('running-total').textContent = total + ' / 1000';
      roundIndex = 5;
      renderDots();
      document.getElementById('locked-score').textContent = total + ' / 1000';
      document.getElementById('locked-break').textContent = scoreMessage(total);
      const names = data.names || roundList.map(function(x){ return x.name; });
      document.getElementById('locked-list').innerHTML = recapHtml(names, data.scores, data.guesses);
      document.body.classList.add('endgame');
      paintShareBox(document.getElementById('locked-share'), data.scores);
      document.getElementById('locked').classList.add('show');
      setStatus('Already finished today’s five.');
      if (data.guesses && data.guesses.length) showAllPins(data.guesses);
    }

    document.getElementById('submit-btn').onclick = function() { unlockAudio(); submitGuess(); };
    document.getElementById('next-btn').onclick = nextLocation;
    document.getElementById('copy-btn').onclick = function() { copyShare(this); };
    document.getElementById('locked-copy').onclick = function() { copyShare(this); };
    document.body.addEventListener('touchstart', unlockAudio, { once: true, passive: true });
    document.body.addEventListener('click', unlockAudio, { once: true });

    const existing = loadPlayed();
    if (existing) {
      showLocked(existing);
    } else {
      showGuessing();
    }
  </script>
</body>
</html>
